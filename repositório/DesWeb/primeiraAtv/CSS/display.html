<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display</title>
</head>
<style>
    .bloco1, .bloco2,.bloco3{
        display: inline-block;
        width: 200px;
        height: 100px;
        text-align: center;
        opacity: 0.89;
    }
    .bloco1{
        background-color: rgb(157, 79, 230);
        position:fixed;
        top: 50px;
        left: 100px;
    }
    .bloco2{
        background-color: aqua;

    }
    .bloco3{
        background-color: rgb(165, 65, 65);
    }

</style>
<body>
    <div class="bloco1">
        blocos1
    </div>
    <div class="bloco2">
        blocos2
    </div>
    <div class="bloco3">
        blocos3
    </div>
</body>
</html>
